<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Yan 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep: #241833;
    --deep2: #372449;
    --rose: #ff7fa3;
    --gold: #ffd479;
    --lavender: #c9a6e8;
    --cream: #fff6ee;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%;
    height:100vh; height:100dvh;
    background: radial-gradient(ellipse at top, var(--deep2), var(--deep) 70%);
    font-family:'Quicksand', sans-serif;
    color: var(--cream);
    overflow:hidden;
  }
  #sky{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .stage{
    position:relative; z-index:2; width:100%;
    height:100vh; height:100dvh;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #cover, #card{
    min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  /* ---------- COVER ---------- */
  #cover{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; cursor:pointer; padding:24px;
    transition: opacity .8s ease, transform .8s ease;
  }
  #cover.hide{ opacity:0; transform: scale(1.08); pointer-events:none; }

  .envelope{
    width:200px; height:140px; position:relative; margin-bottom:34px;
    animation: float 3.4s ease-in-out infinite;
  }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .env-body{
    position:absolute; inset:0;
    background: linear-gradient(180deg, #ffe3ec, #ffd0dd);
    border-radius:10px;
    box-shadow: 0 20px 40px rgba(0,0,0,.35);
  }
  .env-flap{
    position:absolute; top:0; left:0; width:100%; height:0;
    border-left:100px solid transparent;
    border-right:100px solid transparent;
    border-top:78px solid #ffb8cd;
    transform-origin: top;
    transition: transform .6s cubic-bezier(.6,-0.28,.74,.05);
  }
  #cover:hover .env-flap{ transform: rotateX(-25deg); }
  .env-seal{
    position:absolute; top:52px; left:50%; transform:translateX(-50%);
    width:44px; height:44px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold), #c98a2e 80%);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:0 4px 10px rgba(0,0,0,.35);
    z-index:2;
  }
  #cover h1{
    font-family:'Playfair Display', serif;
    font-style:italic; font-weight:600;
    font-size: clamp(24px, 6vw, 34px);
    margin: 0 0 8px;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(255,212,121,.4);
  }
  #cover p{ margin:0; opacity:.75; font-size:14px; letter-spacing:.5px; }
  .tap-hint{ margin-top:22px; font-size:13px; opacity:.6; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.4} 50%{opacity:.9} }

  /* ---------- CARD ---------- */
  #card{
    max-width: 560px; width:100%; padding: 40px 26px 70px;
    text-align:center; opacity:0; transform: translateY(40px);
    transition: opacity 1s ease, transform 1s ease;
  }
  #card.show{ opacity:1; transform:translateY(0); }

  .eyebrow{
    letter-spacing:3px; text-transform:uppercase; font-size:11px;
    color: var(--lavender); margin-bottom:10px; opacity:.85;
  }
  #card h1{
    font-family:'Playfair Display', serif;
    font-weight:700; font-style:italic;
    font-size: clamp(32px, 9vw, 52px);
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--gold), var(--rose));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 18px rgba(255,127,163,.25));
  }
  .subname{ font-size:15px; opacity:.7; margin-bottom:30px; letter-spacing:.5px; }

  .message{
    font-size: 17px; line-height:1.85; color: var(--cream);
    max-width: 460px; margin: 0 auto 36px;
    text-align:left;
  }
  .message .cap{
    font-family:'Playfair Display', serif; font-style:italic; font-size:26px;
    color: var(--gold);
  }
  .message strong{ color: var(--rose); font-weight:700; }

  /* ---------- FLOWER ---------- */
  .flower-wrap{ margin: 10px auto 40px; display:flex; flex-direction:column; align-items:center; }
  .flower-label{ font-size:12px; opacity:.6; margin-bottom:14px; letter-spacing:.5px;}
  .flower{
    position:relative; width:220px; height:220px;
  }
  .petal{
    position:absolute; top:50%; left:50%; width:88px; height:56px;
    background: linear-gradient(160deg, var(--rose), #ff9dbb);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    transform-origin: 0% 50%;
    cursor:pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,.25);
    transition: filter .3s ease, box-shadow .3s ease;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .petal:nth-child(1){ transform: translate(0,-50%) rotate(0deg); }
  .petal:nth-child(2){ transform: translate(0,-50%) rotate(90deg); background: linear-gradient(160deg, var(--gold), #ffe6a6); }
  .petal:nth-child(3){ transform: translate(0,-50%) rotate(180deg); }
  .petal:nth-child(4){ transform: translate(0,-50%) rotate(270deg); background: linear-gradient(160deg, var(--lavender), #ddc7f2); }
  .petal:hover, .petal.active{ filter:brightness(1.15); box-shadow: 0 0 26px rgba(255,212,121,.5); }
  .flower-center{
    position:absolute; top:50%; left:50%; width:56px; height:56px;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle at 35% 30%, #fff6d8, var(--gold));
    border-radius:50%; z-index:3;
    box-shadow: 0 0 20px rgba(255,212,121,.6);
  }
  .petal-text{
    min-height: 46px; max-width:320px; margin: 6px auto 0;
    font-size:14px; opacity:0; transition: opacity .35s ease;
    font-family:'Playfair Display', serif; font-style:italic;
    color: var(--gold);
  }
  .petal-text.show{ opacity:1; }

  /* ---------- MUSIC ---------- */
  .music-btn{
    position: fixed; top:18px; right:18px; z-index:5;
    width:48px; height:48px; border-radius:50%;
    background: rgba(255,255,255,.08); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.18);
    color: var(--cream); font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .music-btn.playing{ box-shadow: 0 0 0 0 rgba(255,212,121,.6); animation: ring 1.6s ease-out infinite; }
  @keyframes ring{
    0%{ box-shadow: 0 0 0 0 rgba(255,212,121,.5); }
    100%{ box-shadow: 0 0 0 16px rgba(255,212,121,0); }
  }

  .signoff{
    margin-top: 10px; font-family:'Playfair Display', serif; font-style:italic;
    font-size:16px; opacity:.85;
  }
  .signoff span{ color: var(--rose); }
  .music-note{ margin-top:14px; font-size:12px; opacity:.5; letter-spacing:.3px; }

  .hearts{ position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .hearts span{
    position:absolute; bottom:-30px; font-size: 18px; opacity:.7;
    animation: rise linear forwards;
  }
  @keyframes rise{
    to{ transform: translateY(-110vh) translateX(var(--dx)) rotate(360deg); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  /* ---------- SMALL SCREENS ---------- */
  @media (max-width: 380px){
    .envelope{ width:170px; height:120px; }
    .env-flap{ border-left-width:85px; border-right-width:85px; border-top-width:66px; }
    .env-seal{ top:44px; width:38px; height:38px; font-size:17px; }
    #card{ padding: 32px 18px 56px; }
    .message{ font-size:15.5px; }
    .flower{ width:190px; height:190px; }
    .petal{ width:76px; height:48px; }
    .flower-center{ width:48px; height:48px; }
  }
  .music-btn{
    top: calc(18px + env(safe-area-inset-top));
    right: calc(18px + env(safe-area-inset-right));
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="hearts" id="hearts"></div>
<button class="music-btn" id="musicBtn" title="Play a little tune">🎵</button>

<div class="stage">
  <div id="cover">
    <div class="envelope">
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="env-seal">🌸</div>
    </div>
    <h1>For Yan</h1>
    <p>a little something, made just for you</p>
    <div class="tap-hint">tap the envelope to open ✨</div>
  </div>

  <div id="card">
    <div class="eyebrow">A birthday letter</div>
    <h1>Happy Birthday, Yan</h1>
    <div class="subname">or should I say, Nayan ☺</div>

    <div class="message" id="msg"></div>

    <div class="flower-wrap">
      <div class="flower-label">tap a petal 🌸</div>
      <div class="flower">
        <div class="petal" data-text="It's the first thing that makes any room feel warmer. Genuinely one of the best things I get to see.">😊</div>
        <div class="petal" data-text="I could listen to you talk for hours and never once check the time.">💬</div>
        <div class="petal" data-text="Kind in a way that isn't loud about it — you just quietly make people's days better.">🌷</div>
        <div class="petal" data-text="Whatever room you walk into, it just feels lighter. That's a rare thing.">✨</div>
        <div class="flower-center"></div>
      </div>
      <div class="petal-text" id="petalText"></div>
    </div>

    <div class="signoff">With a whole lot of admiration,<br><span>someone who's glad you exist</span> 🎂</div>
    <div class="music-note">Tap the music icon for a soft tune while you read 🎧</div>
  </div>
</div>

<script>
/* ---------- starfield ---------- */
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);
const stars = Array.from({length:90}, () => ({
  x: Math.random()*innerWidth, y: Math.random()*innerHeight,
  r: Math.random()*1.6+0.3, s: Math.random()*0.02+0.005, a: Math.random()
}));
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const st of stars){
    st.a += st.s;
    const op = (Math.sin(st.a)+1)/2;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,246,238,${0.15+op*0.6})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

/* ---------- floating hearts ---------- */
const heartsWrap = document.getElementById('hearts');
const heartChars = ['🌸','💗','✨','🌟','💫'];
function spawnHeart(){
  const el = document.createElement('span');
  el.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
  el.style.left = Math.random()*100+'vw';
  el.style.setProperty('--dx', (Math.random()*80-40)+'px');
  const dur = 6+Math.random()*5;
  el.style.animationDuration = dur+'s';
  el.style.fontSize = (14+Math.random()*14)+'px';
  heartsWrap.appendChild(el);
  setTimeout(()=>el.remove(), dur*1000);
}
setInterval(spawnHeart, 700);

/* ---------- confetti burst ---------- */
function confettiBurst(){
  const colors = ['#ff7fa3','#ffd479','#c9a6e8','#fff6ee'];
  for(let i=0;i<50;i++){
    const el = document.createElement('div');
    const size = 6+Math.random()*6;
    el.style.position='fixed';
    el.style.top='40%';
    el.style.left='50%';
    el.style.width=size+'px';
    el.style.height=size*0.4+'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.zIndex = 4;
    el.style.borderRadius='2px';
    el.style.pointerEvents='none';
    document.body.appendChild(el);
    const angle = Math.random()*Math.PI*2;
    const dist = 120+Math.random()*260;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 80;
    const rot = Math.random()*720-360;
    el.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:1 },
      { transform:`translate(${dx}px, ${dy+300}px) rotate(${rot}deg)`, opacity:0 }
    ], { duration: 1400+Math.random()*900, easing:'cubic-bezier(.2,.7,.3,1)' });
    setTimeout(()=>el.remove(), 2400);
  }
}

/* ---------- typewriter message ---------- */
const fullMessage = `<span class="cap">Hey Yan,</span><br><br>
I wanted your birthday to feel a little more special than just a text message, so I made this small page for you.<br><br>
Your <strong>smile</strong> is genuinely one of my favorite things. It's beautiful, and somehow it feels refreshing every single time, like it lightens up everything around it. I also love talking to you. Our conversations are something I always look forward to.<br><br>
More than that, you are one of the <strong>kindest and most genuine person</strong> I know. You carry such a positive energy, and it shows in everything you do.<br><br>
So here is to you, Yan. I hope this new year of your life brings you as much happiness as you bring to the people around you.`;

function typeMessage(){
  const el = document.getElementById('msg');
  el.innerHTML = fullMessage;
}

/* ---------- open card ---------- */
document.getElementById('cover').addEventListener('click', () => {
  document.getElementById('cover').classList.add('hide');
  confettiBurst();
  setTimeout(() => {
    document.getElementById('cover').style.display = 'none';
    document.getElementById('card').classList.add('show');
    typeMessage();
  }, 500);
});

/* ---------- petals ---------- */
document.querySelectorAll('.petal').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.petal').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    const box = document.getElementById('petalText');
    box.classList.remove('show');
    setTimeout(() => {
      box.textContent = p.dataset.text;
      box.classList.add('show');
    }, 150);
  });
});

/* ---------- soft ambient original tune (Web Audio API) ----------
   Note: actual copyrighted tracks (including NCS releases) can't be embedded
   here, so this is a gentle original pad + melody built to feel calm and warm. */
let audioCtx = null;
let masterGain = null;
let delayNode = null;
let filterNode = null;
let playing = false;
let scheduleId = null;

const padChord = [261.63, 329.63, 392.00];           // soft C major pad, held underneath
const melody   = [523.25, 587.33, 659.25, 587.33, 523.25, 493.88, 440.00, 493.88]; // slow, gentle line
let noteIndex = 0;
let padOscs = [];

function setupAudioGraph(){
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.5;

  filterNode = audioCtx.createBiquadFilter();
  filterNode.type = 'lowpass';
  filterNode.frequency.value = 1800;

  delayNode = audioCtx.createDelay();
  delayNode.delayTime.value = 0.32;
  const feedback = audioCtx.createGain();
  feedback.gain.value = 0.28;
  const delayWet = audioCtx.createGain();
  delayWet.gain.value = 0.35;

  delayNode.connect(feedback);
  feedback.connect(delayNode);
  delayNode.connect(delayWet);

  filterNode.connect(masterGain);
  delayWet.connect(masterGain);
  masterGain.connect(audioCtx.destination);
}

function startPad(){
  padOscs = padChord.map(freq => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.045, audioCtx.currentTime + 2);
    osc.connect(g).connect(filterNode);
    osc.start();
    return { osc, gain: g };
  });
}

function stopPad(){
  padOscs.forEach(({osc, gain}) => {
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
    osc.stop(audioCtx.currentTime + 1.1);
  });
  padOscs = [];
}

function playNote(freq, time, dur){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(0.09, time + 0.15);
  gain.gain.exponentialRampToValueAtTime(0.0008, time + dur);
  osc.connect(gain).connect(filterNode);
  gain.connect(delayNode);
  osc.start(time);
  osc.stop(time + dur + 0.1);
}

function scheduler(){
  if(!playing) return;
  const now = audioCtx.currentTime;
  playNote(melody[noteIndex % melody.length], now, 1.6);
  noteIndex++;
  scheduleId = setTimeout(scheduler, 950);
}

const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', () => {
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    setupAudioGraph();
  }
  playing = !playing;
  musicBtn.classList.toggle('playing', playing);
  musicBtn.textContent = playing ? '⏸' : '🎵';
  if(playing){
    if(audioCtx.state === 'suspended') audioCtx.resume();
    startPad();
    scheduler();
  } else {
    clearTimeout(scheduleId);
    stopPad();
  }
});
</script>
</body>
</html>
